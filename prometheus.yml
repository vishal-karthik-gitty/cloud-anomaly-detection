global:
  scrape_interval: 5s        # how often Prometheus pulls fresh data
  evaluation_interval: 5s

scrape_configs:
  - job_name: "anomaly-detection-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["api:8000"]   # 'api' = the FastAPI service name inside docker-compose networkglobal:
